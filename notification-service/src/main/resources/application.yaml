spring:
  application:
    name: notification-service

  config:
    import: "vault://"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    vault:
      uri: http://${VAULT_HOST:127.0.0.1}:8200
      token: ${VAULT_TOKEN}
      scheme: http
      kv:
        enabled: true
        kv-version: 2
      fail-fast: true

frontend:
  url: ${FRONTEND_ORIGIN:http://localhost:5173}

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://${SERVICE_DISCOVERY_HOST}:8761/eureka
    instance:
      preferIpAddress: true

logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.web.socket.server: TRACE
    org.springframework.messaging.simp: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

sentry:
  send-default-pii: true
  logs:
    enabled: true
    minimum-level: info
  tags:
    service: notification-service