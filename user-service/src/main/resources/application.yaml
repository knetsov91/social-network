spring:
  application:
    name: user-service

  config:
    import: "vault://"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB}?sslMode=DISABLED&allowPublicKeyRetrieval=true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    vault:
      uri: http://${VAULT_HOST:127.0.0.1}:8200
      token: ${VAULT_TOKEN}
      scheme: http
      kv:
        enabled: true
        kv-version: 2
      fail-fast: true

  jpa:
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://${SERVICE_DISCOVERY_HOST}:8761/eureka
    instance:
      preferIpAddress: true


logging:
  level:
    org:
      springframework:
        security: DEBUG
frontend:
  url: http://localhost:5174

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

sentry:
  send-default-pii: true
  logs:
    enabled: true
  tags:
    service: user-service

springdoc:
  swagger-ui:
    path: /api/v1/users/swagger-ui
  api-docs:
    path: /api/v1/users/api-docs


